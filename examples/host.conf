# ~/.config/sh-tafeta/hosts/devbox.conf — generated by `sh-tafeta sync devbox --init`

# ssh destination (an alias from ~/.ssh/config works best)
SSH_HOST=devbox

# local=remote path prefixes. Claude Code keys sessions by absolute path:
# a session started in ~/Projects/app locally must land in the folder that
# /home/alice/code/app maps to on the server, or `claude --resume` won't see it.
PATH_MAP=(
    "$HOME/Projects=/home/alice/code"
    "$HOME=/home/alice"
)

# projects synced when you run `sh-tafeta sync devbox` outside any project
PROJECTS=(
    "$HOME/Projects/app"
    "$HOME/Projects/infra"
)

# extra excludes for --with-source (git ignores, .git and secrets are always excluded)
SOURCE_EXCLUDES+=(data/dumps '*.tar.gz')
